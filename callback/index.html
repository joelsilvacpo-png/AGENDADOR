<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login concluído - Agendador Confronto</title>
<style>
:root{--bg:#ffffff;--fg:#1d1d1f;--mut:#5b5b60;--line:#d8d8dd;--box:#f4f4f6;--btn:#8a5a00;--btnfg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#16140f;--fg:#f3eee2;--mut:#b5ab94;--line:#3a3322;--box:#201c12;--btn:#ffc247;--btnfg:#1a1405}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 Georgia,"Times New Roman",serif}
main{max-width:40rem;margin:0 auto;padding:2.5rem 1.25rem}
h1{font-size:1.8rem;margin:0 0 .5rem}
.mut{color:var(--mut)}
textarea{width:100%;height:7rem;margin:1rem 0 .75rem;padding:.75rem;border:1px solid var(--line);border-radius:6px;background:var(--box);color:var(--fg);font:15px/1.4 Consolas,monospace;resize:vertical}
button{padding:.7rem 1.2rem;border:0;border-radius:6px;background:var(--btn);color:var(--btnfg);font:inherit;font-weight:bold;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--btn);outline-offset:2px}
#ok{margin-left:.75rem}
</style>
</head>
<body>
<main>
<h1 id="titulo">Login concluído</h1>
<p id="msg" class="mut">Copie o código abaixo e cole no Agendador Confronto, no campo pedido pelo programa. Depois pode fechar esta página.</p>
<textarea id="codigo" readonly aria-label="Código de autorização"></textarea>
<button id="copiar" type="button">Copiar código</button><span id="ok" class="mut"></span>
</main>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var code = p.get("code");
  var erro = p.get("error_description") || p.get("error");
  var box = document.getElementById("codigo");
  if (code) {
    box.value = code;
  } else {
    document.getElementById("titulo").textContent = "Não veio um código";
    document.getElementById("msg").textContent = erro ? ("O TikTok informou: " + erro) : "Abra esta página pelo botão Conectar TikTok do programa.";
    box.style.display = "none";
    document.getElementById("copiar").style.display = "none";
  }
  document.getElementById("copiar").addEventListener("click", function(){
    box.select();
    var done = function(){ document.getElementById("ok").textContent = "Copiado."; };
    if (navigator.clipboard) { navigator.clipboard.writeText(box.value).then(done, function(){ document.execCommand("copy"); done(); }); }
    else { document.execCommand("copy"); done(); }
  });
})();
</script>
</body>
</html>
